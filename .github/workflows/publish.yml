name: Publish to npm with pnpm

on:
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Pinned (was `latest`) so publishing uses the same pnpm major that
          # generated pnpm-lock.yaml and the `allowBuilds` settings.
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package (if applicable)
        run: pnpm build

      - name: Publish to npm
        run: pnpm publish --no-git-checks --access public
        env:
          # IMPORTANT: actions/setup-node (registry-url) writes
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into ~/.npmrc,
          # so npm/pnpm only authenticate when the token is exposed as
          # NODE_AUTH_TOKEN. NPM_TOKEN is read by semantic-release's npm plugin,
          # not by `pnpm publish` — using it here sends an anonymous request,
          # which the registry answers with `404 {"error":"Not found"}`.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}